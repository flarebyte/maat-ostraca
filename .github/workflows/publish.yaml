name: Publish npm release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Test release checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check release version
        id: release
        run: python3 .github/scripts/check_release.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Inspect publish contents
        run: npm publish --dry-run --access public

  publish:
    name: Approve and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Recheck release after approval
        run: python3 .github/scripts/check_release.py
      - run: npm ci
      - run: npm run build
      - name: Verify npm supports trusted publishing
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const [major,minor,patch]=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if (!(major>11 || major===11 && (minor>5 || minor===5 && patch>=1))) throw new Error("Trusted publishing requires npm >=11.5.1");'
      - name: Publish to npm
        run: npm publish --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
